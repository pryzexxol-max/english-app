<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Daily Study - Interactive</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #fff;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        textarea {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        textarea:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .section-title {
            font-size: 1.1rem;
            color: var(--accent);
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }
        ul { padding-left: 20px; margin: 0; }
        li { margin-bottom: 8px; line-height: 1.4; font-size: 0.95rem; }
        .meta-info { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; }
        .quiz-item { margin-bottom: 15px; }
        .quiz-item p { margin: 0 0 5px 0; font-weight: 500; }
        input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        .feedback-output {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--accent);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.8rem;
            word-break: break-all;
            margin-top: 10px;
            color: #93c5fd;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 English Daily Study</h1>

    <!-- Khung nhập liệu bài học mới -->
    <div class="card">
        <h3 class="section-title">📥 Nhận Bài Học Từ Gemini</h3>
        <textarea id="rawInput" placeholder="Dán đoạn code định dạng từ Gemini vào đây..."></textarea>
        <button onclick="saveAndRender()">Lưu & Bắt Đầu Học</button>
    </div>

    <!-- Khu vực hiển thị nội dung bài học -->
    <div id="contentArea">
        <div class="card">
            <p style="text-align: center; color: var(--text-muted);">Chưa có bài học. Hãy dán code vào ô trên!</p>
        </div>
    </div>

    <!-- Khu vực nộp bài & Xuất Feedback phản hồi cho Gemini -->
    <div class="card" id="feedbackCard" style="display:none;">
        <h3 class="section-title">📤 Tổng Kết & Báo Cáo Cho Gemini</h3>
        <p style="font-size: 0.9rem; color: var(--text-muted);">Sau khi làm bài xong, bấm nút dưới đây để tạo mã báo cáo kết quả, sau đó copy dán lại vào khung chat với Gemini cho ngày hôm sau:</p>
        <button onclick="generateFeedback()" style="background-color: var(--success);">Tạo Mã Báo Cáo Kết Quả</button>
        <div id="feedbackResult"></div>
    </div>
</div>

<script>
    window.onload = function() {
        const savedData = localStorage.getItem('english_lesson_data');
        if (savedData) {
            document.getElementById('rawInput').value = savedData;
            renderLesson(savedData);
        }
    };

    function saveAndRender() {
        const rawText = document.getElementById('rawInput').value;
        if (!rawText.trim()) return;
        localStorage.setItem('english_lesson_data', rawText);
        renderLesson(rawText);
        document.getElementById('feedbackCard').style.display = 'block';
        alert('Đã lưu bài học thành công! Chúc bạn học tốt.');
    }

    function renderLesson(text) {
        const area = document.getElementById('contentArea');
        
        const dayMatch = text.match(/#day:\s*(.*)/);
        const dayNum = dayMatch ? dayMatch[1].trim() : "1";

        // Trích xuất Vocab
        let vocabHTML = "";
        const vocabSection = text.split('#vocabulary:')[1] ? text.split('#vocabulary:')[1].split('#grammar:')[0] : "";
        if (vocabSection) {
            const lines = vocabSection.trim().split('\n').filter(l => l.trim().startsWith('-'));
            vocabHTML = "<ul>" + lines.map(l => `<li>${l.replace('-', '').trim()}</li>`).join('') + "</ul>";
        }

        // Trích xuất Grammar
        let grammarHTML = "";
        const grammarSection = text.split('#grammar:')[1] ? text.split('#grammar:')[1].split('#review_vocab_quiz:')[0] : "";
        if (grammarSection) {
            const lines = grammarSection.trim().split('\n').filter(l => l.trim().startsWith('-'));
            grammarHTML = "<ul>" + lines.map(l => `<li>${l.replace('-', '').trim()}</li>`).join('') + "</ul>";
        }

        // Trích xuất Quiz (Giả lập khu vực điền đáp án)
        let quizHTML = `<p style="color: var(--text-muted);">Phần trắc nghiệm ôn tập từ vựng:</p>`;
        for(let i=1; i<=5; i++) {
            quizHTML += `
                <div class="quiz-item">
                    <p>Câu ${i}: Điền từ thích hợp vào chỗ trống...</p>
                    <input type="text" class="quiz-answer" data-id="${i}" placeholder="Nhập đáp án...">
                </div>
            `;
        }

        area.innerHTML = `
            <div class="card">
                <div class="meta-info">📅 Ngày học: Day ${dayNum}</div>
                <h3 class="section-title">📚 Từ vựng mới</h3>
                ${vocabHTML}
            </div>
            <div class="card">
                <h3 class="section-title">⚙️ Cấu trúc ngữ pháp</h3>
                ${grammarHTML}
            </div>
            <div class="card">
                <h3 class="section-title">✍️ Bài tập thực hành</h3>
                ${quizHTML}
            </div>
        `;
        document.getElementById('feedbackCard').style.display = 'block';
    }

    function generateFeedback() {
        const answers = document.querySelectorAll('.quiz-answer');
        let summary = "#session_feedback:\n- status: completed\n- notes: Đã hoàn thành bài tập trên app offline.";
        
        // Tạo đoạn text gọn gàng để user copy
        const outputDiv = document.getElementById('feedbackResult');
        outputDiv.innerHTML = `
            <div class="feedback-output" id="copyText">${summary}</div>
            <button onclick="navigator.clipboard.writeText(document.getElementById('copyText').innerText); alert('Đã copy mã báo cáo! Hãy dán vào khung chat với Gemini.');" style="background-color: #8b5cf6; margin-top: 8px;">📋 Copy Mã Báo Cáo</button>
        `;
    }
</script>

</body>
</html>
